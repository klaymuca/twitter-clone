<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">Twitter Clone</h1>
        </header>
        <section>
            <h2 class="name">Name</h2>
            <p class="username">@Username</p>
            <form id="tweet-form">
                <textarea id="tweet-input" placeholder="What's happening?"></textarea>
                <p class="character-counter">0/280</p>
                <button class="tweet-button" type="submit">Tweet</button>
            </form>
        </section>
        <section>
            <h2 class="timeline-title">Timeline</h2>
            <ul class="timeline">
                <li>
                    <p><strong class="name">Name</strong> @username <i class="timestamp">timestamp</i></p>
                    <p class="tweet-content"></p>
                    <button class="like-button">Like</button>
                    <button class="delete-button">Delete</button>
                </li>
            </ul>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
